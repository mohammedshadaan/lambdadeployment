version: 0.2

env:
  variables:
    LAMBDA_FUNCTION_NAME: "test-lambda-function"
    S3_BUCKET: "triggerlambda031225"
    AWS_DEFAULT_REGION: "ap-southeast-2"

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "Installing production dependencies..."
      - npm ci --omit=dev

  build:
    commands:
      - echo "Cleaning old package..."
      - rm -f function.zip
      - mkdir -p node_modules
      - echo "Creating deployment package for S3 backup..."
      - zip -r function.zip index.mjs package.json package-lock.json node_modules *.html *.css index.js customer-dashboards images partner-registration-forms start-flow styles
      - echo "Uploading package backup to S3..."
      - aws s3 cp function.zip "s3://$S3_BUCKET/builds/function-$CODEBUILD_RESOLVED_SOURCE_VERSION.zip"

  post_build:
    commands:
      - echo "Deploying new code to Lambda from S3..."
      - >
        aws lambda update-function-code
        --function-name "$LAMBDA_FUNCTION_NAME"
        --s3-bucket "$S3_BUCKET"
        --s3-key "builds/function-$CODEBUILD_RESOLVED_SOURCE_VERSION.zip"
        --publish
      - aws lambda wait function-updated --function-name "$LAMBDA_FUNCTION_NAME"
      - echo "Deployment completed successfully!"

artifacts:
  # List the raw files directly so CodePipeline packages them correctly at the root of the Lambda deployment
  files:
    - index.mjs
    - package.json
    - package-lock.json
    - node_modules/**/*
    - '*.html'
    - '*.css'
    - 'index.js'
    - 'customer-dashboards/**/*'
    - 'images/**/*'
    - 'partner-registration-forms/**/*'
    - 'start-flow/**/*'
    - 'styles/**/*'
